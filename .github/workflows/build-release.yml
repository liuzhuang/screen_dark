name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Test and package (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        run: swift test

      - name: Build app bundle
        env:
          INSTALL_DIR: ${{ github.workspace }}/dist
          NO_LAUNCH: "1"
        run: ./reinstall.sh

      - name: Create DMG and checksum
        run: |
          DMG_ROOT="$(/usr/bin/mktemp -d)"
          trap '/bin/rm -rf "$DMG_ROOT"' EXIT

          /usr/bin/ditto dist/ScreenDark.app "$DMG_ROOT/ScreenDark.app"
          /bin/ln -s /Applications "$DMG_ROOT/Applications"

          /usr/bin/hdiutil create \
            -volname "ScreenDark" \
            -srcfolder "$DMG_ROOT" \
            -format UDZO \
            -ov \
            dist/ScreenDark-macos-arm64.dmg

          cd dist
          /usr/bin/shasum -a 256 ScreenDark-macos-arm64.dmg \
            > ScreenDark-macos-arm64.dmg.sha256
          /usr/bin/hdiutil verify ScreenDark-macos-arm64.dmg
          /usr/bin/shasum -a 256 -c ScreenDark-macos-arm64.dmg.sha256

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screendark-macos-arm64-dmg
          path: |
            dist/ScreenDark-macos-arm64.dmg
            dist/ScreenDark-macos-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screendark-macos-arm64-dmg
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --generate-notes \
            --title "ScreenDark $GITHUB_REF_NAME"

name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Test and package (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        run: swift test

      - name: Build app bundle
        env:
          INSTALL_DIR: ${{ github.workspace }}/dist
          NO_LAUNCH: "1"
        run: ./reinstall.sh

      - name: Create archive and checksum
        run: |
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            dist/ThanosLight.app dist/Screen-Dark-macos-arm64.zip
          cd dist
          /usr/bin/shasum -a 256 Screen-Dark-macos-arm64.zip \
            > Screen-Dark-macos-arm64.zip.sha256

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screen-dark-macos-arm64
          path: |
            dist/Screen-Dark-macos-arm64.zip
            dist/Screen-Dark-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screen-dark-macos-arm64
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --generate-notes \
            --title "Screen Dark $GITHUB_REF_NAME"
